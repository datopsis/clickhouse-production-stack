---
stack_name: clickhouse
stack_root: /srv/clickhouse-stack
stack_shards: 1
stack_bootstrap: false
stack_instance_type: m7i.large
stack_root_volume_gib: 100
stack_nodes:
  - {name: keeper1, role: keeper, id: 1, az: a}
  - {name: keeper2, role: keeper, id: 2, az: b}
  - {name: keeper3, role: keeper, id: 3, az: c}
  - {name: replica1, role: clickhouse, id: 1, az: a}
  - {name: replica2, role: clickhouse, id: 2, az: b}
stack_client_security_groups: []
stack_service_ports:
  keeper: [9281, 9444]
  clickhouse: [8443, 9440, 9010]
# Backup schedule and retention are configurable owner decisions.
stack_backup_node: replica1
stack_backup_database: default
stack_backup_prefix: clickhouse
stack_backup_schedule: '*-*-* 02:00:00 UTC'
stack_backup_full_every_hours: 168
stack_backup_retention_days: 30
stack_backup_max_age_hours: 26
stack_backup_object_lock: false
