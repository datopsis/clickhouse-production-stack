---
- name: Validate topology and image
  ansible.builtin.import_tasks: topology.yml

- name: Require an immutable image without a mutable tag
  ansible.builtin.assert:
    that:
      - stack_image is string
      - stack_image is match('^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9/._-]+@sha256:[0-9a-f]{64}$')
    fail_msg: Supply the real digest of the reviewed image. Tags and missing images are refused.

- name: Validate deployment secret presence without disclosing values
  ansible.builtin.assert:
    that:
      - stack_secrets.admin_password | length >= 32
      - stack_secrets.reader_password | length >= 32
      - stack_secrets.interserver_password | length >= 32
      - stack_secrets.cluster_secret | length >= 32
      - stack_secrets.keeper_identity is match('^[a-zA-Z0-9_-]+:.{32,}$')
      - stack_secrets.ca_cert | length > 0
      - stack_secrets.nodes[item.name].cert | length > 0
      - stack_secrets.nodes[item.name].key | length > 0
  loop: '{{ stack_nodes }}'
  no_log: true

- name: Validate backup scheduling and retention
  ansible.builtin.assert:
    that:
      - stack_backup_node in (stack_nodes | selectattr('role', 'equalto', 'clickhouse') | map(attribute='name') | list)
      - stack_backup_database is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - stack_backup_retention_days | int > 0
      - stack_backup_full_every_hours | int > 0
      - stack_backup_max_age_hours | int > 0
      - stack_backup_schedule | length > 0
      - stack_backup_bucket is match('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
      - stack_backup_prefix is match('^[a-zA-Z0-9_-]+$')
